<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My PDF Viewer</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(127,127,127,.3);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(127,127,127,.5);
      background: rgba(127,127,127,.12);
      font-size: 14px;
      cursor: pointer;
    }
    main { height: calc(100vh - 60px); }
    iframe { width: 100%; height: 100%; border: 0; }
    .note { font-size: 13px; opacity: .75; }
  </style>
</head>
<body>
  <header>
    <strong>PDF:</strong>
    <select id="pdfSelect">
      <option value="" disabled>Loading PDFs…</option>
    </select>

    <button id="openBtn">Open</button>
    <button id="copyLinkBtn" title="Copy a link to this PDF">Copy Link</button>
    <span class="note">Tip: share links like <code>?file=myfile.pdf</code></span>
  </header>

  <main>
    <iframe id="viewer" title="PDF Viewer"></iframe>
  </main>

  <script>
    const select = document.getElementById("pdfSelect");
    const viewer = document.getElementById("viewer");

    // When on GitHub Pages: owner from hostname (e.g. mu5hf1qur.github.io), repo from path (e.g. /pdf/)
    // Fallback for local or other hosting (uses your repo; change if different)
    function getGitHubRepo() {
      const host = window.location.hostname;
      const path = window.location.pathname.replace(/^\/|\/$/g, "");
      if (host.endsWith(".github.io")) {
        const owner = host.replace(".github.io", "").toLowerCase();
        const repo = path.split("/")[0] || "pdf";
        return { owner, repo };
      }
      return { owner: "MU5HF1QUR", repo: "pdf" };
    }

    async function loadPdfList() {
      const { owner, repo } = getGitHubRepo();
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error("Repo not found or not public");
        const items = await res.json();
        const pdfs = Array.isArray(items)
          ? items.filter((f) => f.type === "file" && f.name.toLowerCase().endsWith(".pdf"))
          : [];
        select.innerHTML = "";
        if (pdfs.length === 0) {
          select.innerHTML = '<option value="" disabled>No PDFs in this repo</option>';
          return;
        }
        pdfs.forEach((f) => {
          const opt = document.createElement("option");
          opt.value = f.name;
          opt.textContent = f.name.replace(/\.pdf$/i, "");
          select.appendChild(opt);
        });
        applyUrlOrFirst();
      } catch (err) {
        select.innerHTML = '<option value="" disabled>Could not load PDF list</option>';
        console.error(err);
      }
    }

    function openSelectedPdf() {
      const file = select.value;
      if (!file) return;
      const encoded = encodeURIComponent(file);
      viewer.src = encoded;
      const url = new URL(window.location.href);
      url.searchParams.set("file", file);
      history.replaceState({}, "", url);
    }

    function applyUrlOrFirst() {
      const params = new URLSearchParams(window.location.search);
      const fileParam = params.get("file");
      if (fileParam && [...select.options].some((o) => o.value === fileParam)) {
        select.value = fileParam;
      } else if (select.options.length) {
        select.selectedIndex = 0;
      }
      openSelectedPdf();
    }

    document.getElementById("openBtn").addEventListener("click", openSelectedPdf);

    document.getElementById("copyLinkBtn").addEventListener("click", async () => {
      const file = select.value;
      if (!file) return;
      const share = new URL(window.location.href);
      share.searchParams.set("file", file);
      await navigator.clipboard.writeText(share.toString());
      alert("Copied link!");
    });

    loadPdfList();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My PDF Viewer</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(127,127,127,.3);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(127,127,127,.5);
      background: rgba(127,127,127,.12);
      font-size: 14px;
      cursor: pointer;
    }
    main { height: calc(100vh - 60px); }
    iframe { width: 100%; height: 100%; border: 0; }
    .note { font-size: 13px; opacity: .75; }
  </style>
</head>
<body>
  <header>
    <strong>PDF:</strong>
    <select id="pdfSelect">
      <!-- Put your PDFs here (filenames must match what’s in the repo) -->
      <option value="myfile.pdf">myfile.pdf</option>
      <option value="SDA_EXAM_1_5_2025.pdf">SDA_EXAM_1_5_2025</option>
      <option value="SDA_EXAM_2_5_2025.pdf">SDA_EXAM_2_5_2025</option>
    </select>

    <button id="openBtn">Open</button>
    <button id="copyLinkBtn" title="Copy a link to this PDF">Copy Link</button>
    <span class="note">Tip: share links like <code>?file=myfile.pdf</code></span>
  </header>

  <main>
    <iframe id="viewer" title="PDF Viewer"></iframe>
  </main>

  <script>
    const select = document.getElementById("pdfSelect");
    const viewer = document.getElementById("viewer");

    function openSelectedPdf() {
      const file = select.value;

      // Encode the filename safely
      const encoded = encodeURIComponent(file);

      // Load the PDF in the iframe
      viewer.src = encoded;

      // Update URL so you can share it
      const url = new URL(window.location.href);
      url.searchParams.set("file", file);
      history.replaceState({}, "", url);
    }

    // Load from URL param if present: ?file=myfile.pdf
    const params = new URLSearchParams(window.location.search);
    const fileParam = params.get("file");
    if (fileParam) {
      // If it matches an option, select it; otherwise still try to load it
      const exists = [...select.options].some(o => o.value === fileParam);
      if (exists) select.value = fileParam;
      viewer.src = encodeURIComponent(fileParam);
    } else {
      openSelectedPdf(); // default first option
    }

    document.getElementById("openBtn").addEventListener("click", openSelectedPdf);

    document.getElementById("copyLinkBtn").addEventListener("click", async () => {
      const file = select.value;
      const share = new URL(window.location.href);
      share.searchParams.set("file", file);
      await navigator.clipboard.writeText(share.toString());
      alert("Copied link!");
    });
  </script>
</body>
</html>
